name: Evidence and method checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source and experiment records
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libudev-dev
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Block personal data in staged files and fetched history
        run: |
          cargo +1.96.0 build --release --locked -p workspace-tools --bin privacy-guard
          target/release/privacy-guard check --public-only
          target/release/privacy-guard history --public-only
      - name: Check Rust formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Exercise positive and adversarial tests
        run: cargo +1.96.0 test --workspace --locked
      - name: Check lints and documentation
        run: |
          cargo +1.96.0 clippy --workspace --locked --all-targets -- -D warnings
          cargo +1.96.0 doc --workspace --locked --no-deps
      - name: Build workspace utilities
        run: cargo +1.96.0 build --release --locked -p workspace-tools
      - name: Check vendored style sources without network access
        run: target/release/style-sources check
      - name: Check OS evaluation host tools
        working-directory: projects/os-evaluation
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --workspace --locked
          cargo +1.96.0 clippy --workspace --locked --all-targets -- -D warnings
          cargo +1.96.0 doc --workspace --locked --no-deps
          cargo +1.96.0 build --release --locked -p benchctl
      - name: Check wireless control and retained functional probes
        working-directory: projects/wireless-explorer
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --workspace --locked
          cargo +1.96.0 clippy --workspace --locked --all-targets -- -D warnings
          cargo +1.96.0 doc --workspace --locked --no-deps
          cargo +1.96.0 build --release --locked -p wxctl
          rustc +1.96.0 --test --edition=2024 firmware/src/buffer.rs -o target/buffer-tests
          target/buffer-tests
          target/release/wxctl verify-probes --ledger results/evidence.json
          if target/release/wxctl replay --capture results/control-2026-10-24/info-01; then exit 1; fi
          if target/release/wxctl replay --capture results/control-2026-10-24/scan-01; then exit 1; fi
      - name: Check device identity inventory summaries
        working-directory: projects/device-identity
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --workspace --locked
          cargo +1.96.0 clippy --workspace --locked --all-targets -- -D warnings
          cargo +1.96.0 doc --workspace --locked --no-deps
          (cd results/baseline-2026-10-24 && sha256sum --check SHA256SUMS)
          (cd results/runtime-table-2026-10-24 && sha256sum --check SHA256SUMS)
          (cd results/usb-control-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/wifi-observer-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/wifi-ap-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/wifi-beacon-profiles-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/wifi-restart-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/saved-identity-audits-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/wifi-window-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/provisioning-metadata-2026-10-25 && sha256sum --check SHA256SUMS)
          (cd results/flash-identity-2026-10-26 && sha256sum --check SHA256SUMS)
          (cd results/ble-identity-2026-10-26 && sha256sum --check SHA256SUMS)
          (cd results/saved-flash-coverage-2026-10-26 && sha256sum --check SHA256SUMS)
          (cd results/factory-trim-2026-10-27 && sha256sum --check SHA256SUMS)
      - name: Check anonymization identity library
        working-directory: projects/anonymization
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --workspace --locked
          cargo +1.96.0 clippy --workspace --locked --all-targets -- -D warnings
          cargo +1.96.0 doc --workspace --locked --no-deps
      - name: Check anonymization adapter plan and sequencing on the host
        working-directory: projects/anonymization/esp-idf
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --locked --lib --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]'
          cargo +1.96.0 clippy --locked --lib --tests --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]' -- -D warnings
          cargo +1.96.0 doc --locked --no-deps --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]'
      - name: Check anonymization example protocol on the host
        working-directory: projects/anonymization/examples/softap
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --locked --lib --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]'
          cargo +1.96.0 clippy --locked --lib --tests --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]' -- -D warnings
          cargo +1.96.0 doc --locked --no-deps --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]'
      - name: Check BLE protocol and firmware controller on the host
        working-directory: projects/device-identity/firmware-ble
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 test --locked --lib --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]'
          cargo +1.96.0 test --locked --doc --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]'
          cargo +1.96.0 clippy --locked --lib --tests --target x86_64-unknown-linux-gnu --config 'unstable.build-std=[]' -- -D warnings
      - name: Check bounded Kismet worker
        working-directory: projects/device-identity/tools/kismet-worker
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 test --locked --offline
          cargo +1.90.0 clippy --locked --offline --all-targets -- -D warnings
          cargo +1.90.0 doc --locked --offline --no-deps
      - name: Verify public lineage, historical declarations and retained raw replays
        run: projects/os-evaluation/target/release/benchctl verify-public-snapshot --root . --ledger projects/os-evaluation/quality/evidence.json --manifest quality/publication.json
      # Omitted binaries and replaced Git ancestry prevent exact-artifact method,
      # original-freeze and comparative-study qualification in this public copy.
      # Complete-bundle commands and adversarial unit fixtures remain intact.

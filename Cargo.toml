[workspace]
exclude = [
    "projects/anonymization",
    "projects/device-identity",
    "projects/os-evaluation",
    "projects/wireless-explorer",
]
members = ["tools/workspace-tools"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[package]
name = "wireless-explorer-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "ESP32-C6-DevKitC-1-N8 dual serial control and passive Wi-Fi discovery"

[workspace]

[dependencies]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
wireless-protocol = { path = "../crates/wireless-protocol" }

[build-dependencies]
embuild = "=0.33.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 2

[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.5.6"
esp_idf_tools_install_dir = "workspace"
mcu = "esp32c6"

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = ".embuild/espressif/esp-idf/v5.5.6/components/ieee802154/include/esp_ieee802154.h"


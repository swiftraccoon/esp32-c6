[package]
name = "c6-anonymization-esp-idf"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
description = "Explicit early-startup ESP32-C6 SoftAP identity adapter"

[workspace]

[dependencies]
c6-anonymization-identity = { path = "../crates/identity" }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }

[build-dependencies]
embuild = { version = "=0.33.7", features = ["espidf"] }

[profile.release]
codegen-units = 1
debug = 2
lto = "thin"
opt-level = 3
panic = "abort"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "workspace"
esp_idf_version = "tag:v5.5.6"
mcu = "esp32c6"

[workspace]
exclude = ["firmware", "firmware-ble", "firmware-wifi", "tools/kismet-worker"]
members = [
    "crates/runtime-protocol",
    "crates/usb-observer",
    "crates/wifi-observer",
    "crates/wifi-protocol",
    "tools/identityctl",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.96"

[package]
name = "usb-observer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Private USB descriptor and read-only bridge configuration records"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "=0.72.1"
sha2 = "=0.10.9"

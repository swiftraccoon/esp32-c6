[package]
name = "device-identity-firmware"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
description = "UART-controlled ESP32-C6 runtime MAC-table inventory without radio startup"

[workspace]

[dependencies]
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf", rev = "a209052f378be61dd0f2d566b7fbe0f9593b0cd5" }
runtime-protocol = { path = "../crates/runtime-protocol" }

[build-dependencies]
embuild = "=0.33.7"

[profile.release]
codegen-units = 1
debug = 2
lto = "thin"
opt-level = 3
panic = "abort"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "workspace"
esp_idf_version = "tag:v5.5.6"
mcu = "esp32c6"

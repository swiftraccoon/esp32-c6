[package]
name = "workspace-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Workspace privacy enforcement and offline style source maintenance"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10"
